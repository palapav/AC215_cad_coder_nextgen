version: '3.8'

services:
  data_ingestion:
    build:
      context: ./data_ingestion
      dockerfile: Dockerfile
    volumes:
      - ./data:/data  # Adjust according to your data directory
    command: ["python", "dataloader.py"]
    user: "0:0"

  preprocessing:
    build:
      context: ./data_preprocessing
      dockerfile: Dockerfile
    depends_on:
      - data_ingestion
    volumes:
      - ./data:/data  # Ensure the data is shared
    command: [
      "python", "preprocess_cv.py",
      "--input_dir", "/data/raw_test",
      "--output_dir", "/data/processed_test"
    ]
    user: "0:0"

  # Uncomment and adjust for the rag service if needed
