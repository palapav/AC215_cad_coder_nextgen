[project]
name = "cad-coder-backend"
version = "1.2.0"
description = "FastAPI backend for CAD-Coder supporting multi-model generation, RAG, and pipeline orchestration"
authors = [{ name = "CAD-Coder Team", email = "team@cadcoder.ai" }]
readme = "README.md"
requires-python = ">=3.11"

[project.dependencies]
fastapi = ">=0.115.0"
uvicorn = ">=0.32.0"
pydantic = ">=2.8.2"
pymongo = ">=4.9.0"
google-cloud-storage = ">=2.17.0"
python-dotenv = ">=1.0.1"
google-auth = ">=2.34.0"
google-auth-oauthlib = ">=1.2.1"
httpx = ">=0.27.0"
pillow = ">=10.0.0"
modal = ">=0.64.0"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "mongomock>=4.1.2",
]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: mark test as integration test",
    "e2e: mark test as end-to-end test",
    "slow: mark test as slow running",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/tests/*",
    "app/services/db_service.py",
    "app/main.py",
    "app/add_dummy_data.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == \"__main__\":",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
fail_under = 40
show_missing = true

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401", "F841", "E402"]
exclude = ["node_modules", "__pycache__", ".git", "env", ".venv"]

[tool.black]
line-length = 120
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | node_modules
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = ["node_modules", "__pycache__", ".git", "env", ".venv"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
