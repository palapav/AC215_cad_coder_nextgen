# Docker Compose for backend testing
# Usage:
#   docker compose -f docker-compose.test.yml run --rm test        # Unit tests
#   docker compose -f docker-compose.test.yml run --rm integration # Integration tests
#   docker compose -f docker-compose.test.yml run --rm e2e         # E2E tests
#   docker compose -f docker-compose.test.yml up                   # All tests

services:
  # MongoDB for integration/E2E tests
  mongo-test:
    image: mongo:6
    container_name: cadcoder-mongo-test
    ports:
      - "27018:27017"  # Different port to avoid conflicts
    tmpfs:
      - /data/db  # Use tmpfs for faster tests, no persistence needed
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Unit tests (no external dependencies)
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: cadcoder-backend-test
    environment:
      - PYTHONPATH=/app
      - QWEN_INFERENCE_BACKEND=mock
      - LLAVA_INFERENCE_BACKEND=mock
      - ENABLE_RAG=false
      - MONGO_URI=mongodb://mongo-test:27017
      - MONGO_DB=test_cad_coder
    volumes:
      - ./app/tests:/app/app/tests:ro
      - ./coverage:/app/coverage
    depends_on:
      mongo-test:
        condition: service_healthy
    command: >
      pytest app/tests/ -v 
      --cov=app 
      --cov-config=.coveragerc
      --cov-report=term-missing 
      --cov-report=xml:/app/coverage/backend.xml
      --cov-report=html:/app/coverage/html

  # Integration tests (with real MongoDB, mocked Modal)
  integration:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: cadcoder-backend-integration
    environment:
      - PYTHONPATH=/app
      - QWEN_INFERENCE_BACKEND=mock
      - LLAVA_INFERENCE_BACKEND=mock
      - ENABLE_RAG=false
      - MONGO_URI=mongodb://mongo-test:27017
      - MONGO_DB=test_integration
      # Reduced token counts for faster tests
      - QWEN_MODAL_MAX_NEW_TOKENS=128
      - LLAVA_MODAL_MAX_NEW_TOKENS=128
    depends_on:
      mongo-test:
        condition: service_healthy
    command: >
      pytest app/tests/test_routers.py -v 
      --cov=app 
      --cov-report=term-missing
      -m "not e2e"

  # E2E tests (with real Modal if credentials provided)
  e2e:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: cadcoder-backend-e2e
    env_file:
      - ../.env.test  # Optional: test-specific env file
    environment:
      - PYTHONPATH=/app
      - MONGO_URI=mongodb://mongo-test:27017
      - MONGO_DB=test_e2e
      # Override token counts for faster E2E tests
      - QWEN_MODAL_MAX_NEW_TOKENS=128
      - LLAVA_MODAL_MAX_NEW_TOKENS=128
      - QWEN_MODAL_TEMPERATURE=0.0
      - LLAVA_MODAL_TEMPERATURE=0.0
      # RAG disabled for E2E by default (enable via .env.test if needed)
      - ENABLE_RAG=${ENABLE_RAG:-false}
    depends_on:
      mongo-test:
        condition: service_healthy
    command: >
      pytest app/tests/ -v 
      -m "e2e"
      --tb=short

  # Lint check
  lint:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: cadcoder-backend-lint
    command: >
      sh -c "
        ruff check app/ --ignore E501,F401,F841 --exit-zero &&
        black --check app/ --line-length 120 || true
      "

  # Full test suite (all tests)
  all:
    volumes:
      - ./coverage:/app/coverage
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: cadcoder-backend-all-tests
    environment:
      - PYTHONPATH=/app
      - QWEN_INFERENCE_BACKEND=mock
      - LLAVA_INFERENCE_BACKEND=mock
      - ENABLE_RAG=false
      - MONGO_URI=mongodb://mongo-test:27017
      - MONGO_DB=test_all
      - QWEN_MODAL_MAX_NEW_TOKENS=128
      - LLAVA_MODAL_MAX_NEW_TOKENS=128
    depends_on:
      mongo-test:
        condition: service_healthy
    command: >
      pytest app/tests/ -v 
      --cov=app 
      --cov-config=.coveragerc
      --cov-report=term-missing 
      --cov-report=xml:/app/coverage/backend-all.xml
      --cov-fail-under=50

