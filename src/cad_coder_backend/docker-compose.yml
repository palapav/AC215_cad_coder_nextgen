services:
  mongo:
    image: mongo:6
    container_name: cadcoder-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  backend:
    build: .
    container_name: cadcoder-backend
    env_file: ../.env  # Use .env from parent src/ directory (single source of truth)
    environment:
      # RAG Configuration
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/rag/key.json}
      RAG_DIR: ${RAG_DIR:-/app/rag}
      RAG_PROJECT_ID: ${RAG_PROJECT_ID:-cad-coder-nextgen}
      RAG_LOCATION: ${RAG_LOCATION:-us-central1}
      RAG_INDEX_NAME: ${RAG_INDEX_NAME:-cadcoder-mm-index}
      RAG_ENDPOINT_NAME: ${RAG_ENDPOINT_NAME:-cadcoder-mm-endpoint}
      RAG_DEPLOYED_INDEX_ID: ${RAG_DEPLOYED_INDEX_ID:-test_backend_rag_model_inf_1764239034605}
      ENABLE_RAG: ${ENABLE_RAG:-true}
      # Qwen Modal Configuration
      QWEN_INFERENCE_BACKEND: ${QWEN_INFERENCE_BACKEND:-modal}
      QWEN_MODAL_APP: ${QWEN_MODAL_APP:-cad-coder-qwen3}
      QWEN_MODAL_FUNCTION: ${QWEN_MODAL_FUNCTION:-qwen_modal_infer}
      QWEN_MODAL_MAX_NEW_TOKENS: ${QWEN_MODAL_MAX_NEW_TOKENS:-4096}
      QWEN_MODAL_TEMPERATURE: ${QWEN_MODAL_TEMPERATURE:-0.0}
      # LLaVA Modal Configuration
      LLAVA_INFERENCE_BACKEND: ${LLAVA_INFERENCE_BACKEND:-modal}
      LLAVA_MODAL_APP: ${LLAVA_MODAL_APP:-cad-coder-llava}
      LLAVA_MODAL_FUNCTION: ${LLAVA_MODAL_FUNCTION:-llava_modal_infer}
      LLAVA_MODAL_MAX_NEW_TOKENS: ${LLAVA_MODAL_MAX_NEW_TOKENS:-3450}
      LLAVA_MODAL_TEMPERATURE: ${LLAVA_MODAL_TEMPERATURE:-0.0}
      LLAVA_MODAL_TOP_P: ${LLAVA_MODAL_TOP_P:-1.0}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app        # ⭐⭐⭐ 挂载你的代码
      - ./secrets:/app/secrets
      - ../.env:/app/.env       # Mount .env file from src/ directory
      - ../datapipeline/rag:/app/rag:ro   # Mount RAG assets (key.json, configs)
      # Note: Qwen model directory NOT mounted - inference runs on Modal GPU workers
    # Note: GPU not required for backend - all model inference runs on Modal
    # depends_on:              # Commented out - only needed if using local MongoDB
    #   - mongo                # Remove this if using MongoDB Atlas
    restart: always
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]  # Dev mode with hot reload

  preprocess:
    profiles: ["pipeline"]  # Only build/run when explicitly requested
    build: ../datapipeline/data_preprocessing
    container_name: cadcoder-preprocess
    env_file: ../.env  # Use .env from parent src/ directory
    # No data volumes mounted; container operates purely on code
    command: ["python", "preprocess_cv.py"]

  rag:
    profiles: ["pipeline"]  # Only build/run when explicitly requested
    build: ../datapipeline/rag
    container_name: cadcoder-rag
    env_file: ../.env  # Use .env from parent src/ directory
    # No data volumes mounted; container operates purely on code
    command: ["python", "pipeline.py"]
  
  # Model inference service - DISABLED: Using Modal for GPU inference instead
  # inference:
  #   build:
  #     context: ../model_inference
  #     dockerfile: Dockerfile
  #   depends_on:
  #     - preprocess
  #   volumes:
  #     - ../data:/data
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   entrypoint: /bin/sh -c
  #   command: >
  #     ./scripts/v1_5/eval/test_gencadcode.sh "CADCODER/CAD-Coder" "dataset" && 
  #     python scripts/generate_model_cad.py --dataset_name dataset --model_tested CADCODER/CAD-Coder --code_language cadquery --pc_reps 3 --parallel

volumes:
  mongo_data:
