version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: cadcoder-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  backend:
    build: .
    container_name: cadcoder-backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app        # ⭐⭐⭐ 挂载你的代码
      - ./secrets:/app/secrets
    depends_on:
      - mongo
    restart: always

  ingestion:
    build: ../datapipeline/data_ingestion
    container_name: cadcoder-ingestion
    env_file: .env
    volumes:
      - ../data:/app/data
    command: ["python", "dataloader.py"]

  preprocess:
    build: ../datapipeline/data_preprocessing
    container_name: cadcoder-preprocess
    env_file: .env
    volumes:
      - ../data:/app/data
    command: ["python", "preprocess_cv.py"]

  rag:
    build: ../datapipeline/rag
    container_name: cadcoder-rag
    env_file: .env
    volumes:
      - ../data:/app/data
    command: ["python", "pipeline.py"]

volumes:
  mongo_data:
