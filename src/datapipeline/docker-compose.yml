# Named volumes for caching
volumes:
  hf_cache:
    driver: local

services:
  # ==========================================
  # 0. VALIDATION (runs first)
  # ==========================================
  validate:
    build:
      context: .
      dockerfile: Dockerfile.validate
    container_name: cad-validate
    volumes:
      - ./key.json:/app/key.json:ro
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/key.json
    networks:
      - pipeline_network

  # ==========================================
  # 1. DATA INGESTION
  # ==========================================
  data_ingestion:
    build:
      context: ./data_ingestion
      dockerfile: Dockerfile
    container_name: cad-ingestion
    depends_on:
      validate:
        condition: service_completed_successfully
    volumes:
      - ./key.json:/app/key.json:ro
      - hf_cache:/root/.cache/huggingface  # Cache HF datasets
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/key.json
      - HF_HOME=/root/.cache/huggingface  # Use cached datasets
    command: [
      "python", "dataloader.py",
      "--bucket", "${GCS_BUCKET:-cad-coder-nextgen-data}",
      "--splits", "${PIPELINE_SPLIT:-test}",
      "--limit", "${PIPELINE_LIMIT:-5}"
    ]
    networks:
      - pipeline_network

  # ==========================================
  # 2. DATA PREPROCESSING
  # ==========================================
  preprocessing:
    build:
      context: ./data_preprocessing
      dockerfile: Dockerfile
    container_name: cad-preprocessing
    depends_on:
      data_ingestion:
        condition: service_completed_successfully
    volumes:
      - ./key.json:/app/key.json:ro
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/key.json
    command: [
      "python", "preprocess_cv.py",
      "--bucket", "${GCS_BUCKET:-cad-coder-nextgen-data}",
      "--splits", "${PIPELINE_SPLIT:-test}"
    ]
    networks:
      - pipeline_network

  # ==========================================
  # 3. RAG PIPELINE (Embedding & Vector DB)
  # ==========================================
  rag:
    build:
      context: ./rag
      dockerfile: Dockerfile
    container_name: cad-rag
    depends_on:
      preprocessing:
        condition: service_completed_successfully
    volumes:
      - ./key.json:/app/key.json:ro
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/key.json
    command: [
      "python", "pipeline.py",
      "--bucket", "${GCS_BUCKET:-cad-coder-nextgen-data}",
      "--split", "${PIPELINE_SPLIT:-test}"
    ]
    networks:
      - pipeline_network

  # ==========================================
  # 4. RAG TESTING (runs after RAG completes)
  # ==========================================
  rag_test:
    build:
      context: ./rag
      dockerfile: Dockerfile
    container_name: cad-rag-test
    depends_on:
      rag:
        condition: service_completed_successfully
    volumes:
      - ./key.json:/app/key.json:ro
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/key.json
    command: ["python", "test_rag.py"]  # No args = run all tests
    networks:
      - pipeline_network

networks:
  pipeline_network:
    driver: bridge
