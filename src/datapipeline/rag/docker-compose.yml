version: '3.8'

services:
  rag-pipeline:
    build: .
    container_name: rag-pipeline
    volumes:
      # Mount .env file
      - ./.env:/app/.env:ro
      # Mount key.json (required - must exist in RAG_new folder)
      - ./key.json:/app/key.json:ro
    environment:
      # Use service account key for authentication
      - GOOGLE_APPLICATION_CREDENTIALS=/app/key.json
    command: python test_rag.py single
    network_mode: host

