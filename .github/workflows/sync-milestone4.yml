name: Sync milestone4 from main

on:
  push:
    branches: [ main ]   # whenever main is updated (e.g., PR merge)

permissions:
  contents: write        # needed so the workflow can push to the repo

jobs:
  sync-milestone4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync milestone4 to main (fast-forward)
        run: |
          # Make sure we have up-to-date refs
          git fetch origin

          # Force milestone4 to point at the same commit as main
          git push origin main:milestone4
