version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: cadcoder-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  backend:
    build: .
    container_name: cadcoder-backend
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=cad_coder
      - GCS_BUCKET=cad-coder-bucket
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/data-service-account.json
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    volumes:
      - ./secrets:/app/secrets
    restart: always

volumes:
  mongo_data:
