[project]
name = "cad-coder-backend"
version = "1.0.0"
description = "FastAPI backend for the CAD-Coder vision-language project"
authors = [{ name = "CAD-Coder Team", email = "team@cadcoder.ai" }]
readme = "README.md"
requires-python = ">=3.11"

[project.dependencies]
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
pymongo = "^4.9.0"
pydantic = "^2.8.2"
pytest = "^8.3.2"
google-cloud-storage = "^2.17.0"
python-dotenv = "^1.0.1"

[tool.pytest.ini_options]
pythonpath = ["app"]
addopts = "-v --cov=app"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
