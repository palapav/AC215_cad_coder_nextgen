services:
  # Validation service - runs first to check authentication
  validate:
    build:
      context: ..
      dockerfile: Dockerfile.validate
    container_name: cad-validate
    volumes:
      - ../key.json:/app/key.json:ro
    env_file:
      - ../.env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/key.json

  # Preprocessing service - runs after validation passes
  preprocessing:
    build: .
    container_name: cad-preprocessing-test
    depends_on:
      validate:
        condition: service_completed_successfully
    volumes:
      - ../key.json:/app/key.json:ro
    env_file:
      - ../.env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/key.json
    command: [
      "python", "preprocess_cv.py",
      "--bucket", "${GCS_BUCKET:-cad-coder-nextgen-data}",
      "--splits", "${INGESTION_SPLITS:-test}"
    ]
    network_mode: host

