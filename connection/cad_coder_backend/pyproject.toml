[project]
name = "cad-coder-backend"
version = "1.2.0"
description = "FastAPI backend for CAD-Coder supporting multi-model generation, RAG, and pipeline orchestration"
authors = [{ name = "CAD-Coder Team", email = "team@cadcoder.ai" }]
readme = "README.md"
requires-python = ">=3.11"

[project.dependencies]
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
pydantic = "^2.8.2"
pytest = "^8.3.2"
pymongo = "^4.9.0"
google-cloud-storage = "^2.17.0"
python-dotenv = "^1.0.1"
google-auth = "^2.34.0"
google-auth-oauthlib = "^1.2.1"
httpx = "^0.27.0"

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
