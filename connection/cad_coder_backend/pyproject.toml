[project]
name = "cad-coder-backend"
version = "1.2.0"
description = "FastAPI backend for CAD-Coder supporting multi-model generation, RAG, and pipeline orchestration"
authors = [{ name = "CAD-Coder Team", email = "team@cadcoder.ai" }]
readme = "README.md"
requires-python = ">=3.11"

[project.dependencies]
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
pydantic = "^2.8.2"
pytest = "^8.3.2"
pymongo = "^4.9.0"
google-cloud-storage = "^2.17.0"
python-dotenv = "^1.0.1"
google-auth = "^2.34.0"
google-auth-oauthlib = "^1.2.1"
httpx = "^0.27.0"

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-report=html"
testpaths = ["app/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/secrets/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
fail_under = 50
precision = 2
show_missing = true

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
