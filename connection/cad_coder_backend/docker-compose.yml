services:
  # MongoDB service removed - using MongoDB Atlas (cloud) instead of local container
  # The MONGO_URI in .env points to: mongodb+srv://...@cad-coder.yld0dwv.mongodb.net/...
  # mongo:
  #   image: mongo:6
  #   container_name: cadcoder-mongo
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo_data:/data/db
  #   restart: always

  backend:
    build: .
    container_name: cadcoder-backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app        # ⭐⭐⭐ 挂载你的代码
      - ./secrets:/app/secrets
      - ../model_inference:/workspace/model_inference  # Mount model_inference for inference scripts
      - ..:/workspace  # Mount entire project root for path resolution
    # depends_on:
    #   - mongo  # Removed - using MongoDB Atlas (cloud) instead
    restart: always

  # ingestion:
  #   build: ../datapipeline/data_ingestion
  #   container_name: cadcoder-ingestion
  #   env_file: .env
  #   volumes:
  #     - ../data:/app/data
  #   command: ["python", "dataloader.py"]

  preprocess:
    build: ../datapipeline/data_preprocessing
    container_name: cadcoder-preprocess
    env_file: .env
    volumes:
      - ../data:/app/data
      - ..:/workspace  # Mount entire project to access images from model_inference
    command: ["python", "preprocess_cv.py", "--input_dir", "/workspace/model_inference/docs/static/images", "--output_dir", "/app/data"]

  # rag:
  #   build: ../datapipeline/rag
  #   container_name: cadcoder-rag
  #   env_file: .env
  #   volumes:
  #     - ../data:/app/data
  #   command: ["python", "pipeline.py"]
  
  inference:
    build:
      context: ../model_inference
      dockerfile: Dockerfile
    platform: linux/amd64
    depends_on:
      - preprocess
    volumes:
      - ./data:/data  # Ensure the data is shared
    # entrypoint: /bin/sh -c  # Allows multiple commands to run in sequence
    # command: >
    #   ./scripts/v1_5/eval/test_gencadcode.sh "CADCODER/CAD-Coder" "dataset" && 
    #   python scripts/generate_model_cad.py --dataset_name dataset --model_tested CADCODER/CAD-Coder --code_language cadquery --pc_reps 3 --parallel


