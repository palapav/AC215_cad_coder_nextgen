---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cad-coder
  labels:
    app: cad-coder
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cad-coder
      component: frontend
  template:
    metadata:
      labels:
        app: cad-coder
        component: frontend
    spec:
      # Anti-affinity for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: cad-coder
                    component: frontend
                topologyKey: kubernetes.io/hostname
      
      containers:
        - name: frontend
          image: ${ARTIFACT_REGISTRY}/cad-coder-frontend:latest
          imagePullPolicy: Always
          
          ports:
            - containerPort: 80
              name: http
          
          env:
            - name: VITE_API_URL
              value: "/api"
          
          resources:
            requests:
              cpu: "50m" # Was 100m
              memory: "64Mi" # Was 128Mi
            limits:
              cpu: "500m"
              memory: "512Mi"
          
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: false
---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cad-coder
  labels:
    app: cad-coder
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: cad-coder
    component: frontend
---
# Horizontal Pod Autoscaler for Frontend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: cad-coder
  labels:
    app: cad-coder
    component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
---
# Pod Disruption Budget for Frontend
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: cad-coder
  labels:
    app: cad-coder
    component: frontend
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app: cad-coder
      component: frontend
