---
# External Secrets (to be populated via Secret Manager or manually)
# This file serves as a template - actual secrets should be created via:
# kubectl create secret generic cad-coder-secrets --from-literal=MONGO_URI=... --from-literal=...
apiVersion: v1
kind: Secret
metadata:
  name: cad-coder-secrets
  namespace: cad-coder
  labels:
    app: cad-coder
type: Opaque
stringData:
  # MongoDB Connection String
  MONGO_URI: "mongodb://localhost:27017"
  
  # Hugging Face Token (for model downloads)
  HF_TOKEN: ""
---
# GCP Service Account Key (mounted as file)
apiVersion: v1
kind: Secret
metadata:
  name: gcp-credentials
  namespace: cad-coder
  labels:
    app: cad-coder
type: Opaque
data:
  # Base64 encoded service account JSON key
  # Create with: kubectl create secret generic gcp-credentials --from-file=key.json=path/to/key.json
  key.json: ""
---
# TLS Certificate for Ingress
apiVersion: v1
kind: Secret
metadata:
  name: cad-coder-tls
  namespace: cad-coder
  labels:
    app: cad-coder
type: kubernetes.io/tls
data:
  # Base64 encoded TLS certificate and key
  # Create with: kubectl create secret tls cad-coder-tls --cert=path/to/cert.pem --key=path/to/key.pem
  tls.crt: ""
  tls.key: ""
