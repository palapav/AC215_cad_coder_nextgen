---
# Light Load Test Job (Baseline)
apiVersion: batch/v1
kind: Job
metadata:
  name: load-test-light
  namespace: cad-coder
  labels:
    app: cad-coder
    component: load-test
    scenario: light
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: cad-coder
        component: load-test
        scenario: light
    spec:
      restartPolicy: Never
      containers:
        - name: locust
          image: locustio/locust:2.20.0
          command:
            - locust
            - -f
            - /mnt/locustfile.py
            - --headless
            - --host=http://backend:8000
            - -u
            - "10"        # 10 concurrent users
            - -r
            - "2"         # 2 users/second spawn rate
            - -t
            - "5m"        # 5 minute duration
            - --csv=/results/light-load
            - --html=/results/light-load-report.html
          volumeMounts:
            - name: locustfile
              mountPath: /mnt
            - name: results
              mountPath: /results
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: locustfile
          configMap:
            name: locust-config
        - name: results
          emptyDir: {}
